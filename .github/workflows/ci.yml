name: CI
on:
  push:
    branches:
      - master
    tags: ['*']
  pull_request:
concurrency:
  # cancel superseded runs on pull requests, but not on master or tags
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {version: '1', os: ubuntu-latest, arch: x64}
          - {version: '1', os: ubuntu-latest, arch: x86}
          - {version: '1', os: ubuntu-24.04-arm, arch: aarch64}
          - {version: '1', os: windows-latest, arch: x64}
          - {version: '1', os: windows-latest, arch: x86}
          - {version: '1', os: macOS-latest, arch: aarch64}
          - {version: '1', os: macOS-15-intel, arch: x64}
          - {version: 'nightly', os: ubuntu-latest, arch: x64}
          - {version: '1.3', os: ubuntu-latest, arch: x64}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@latest
      - uses: julia-actions/julia-runtest@latest
      - uses: julia-actions/julia-processcoverage@latest
      - uses: codecov/codecov-action@v7
        with:
          file: lcov.info
